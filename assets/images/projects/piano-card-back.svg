<text x="36" y="480" font-family="Arial, sans-serif" font-size="20" fill="#233e33" text-anchor="start" font-weight="700">C4</text>
<text x="120" y="480" font-family="Arial, sans-serif" font-size="17" fill="#233e33" text-anchor="start" font-weight="400">Replace this hand’s keys</text>
<text x="462" y="480" font-family="Arial, sans-serif" font-size="20" fill="#b34545" text-anchor="start" font-weight="700">E4 ●</text>
<text x="546" y="480" font-family="Arial, sans-serif" font-size="17" fill="#233e33" text-anchor="start" font-weight="400">Add; keep other keys held</text>
<text x="36" y="516" font-family="Arial, sans-serif" font-size="20" fill="#326abd" text-anchor="start" font-weight="700">E4 ○</text>
<text x="120" y="516" font-family="Arial, sans-serif" font-size="17" fill="#233e33" text-anchor="start" font-weight="400">Release only this key</text>
<text x="462" y="516" font-family="Arial, sans-serif" font-size="20" fill="#6a796b" text-anchor="start" font-weight="700">—</text>
<text x="546" y="516" font-family="Arial, sans-serif" font-size="17" fill="#233e33" text-anchor="start" font-weight="400">No change: hold or stay silent</text>
<text x="36" y="552" font-family="Arial, sans-serif" font-size="20" fill="#233e33" text-anchor="start" font-weight="700">·</text>
<text x="120" y="552" font-family="Arial, sans-serif" font-size="17" fill="#233e33" text-anchor="start" font-weight="400">Release every key in this hand</text>
<text x="36" y="602" font-family="Arial, sans-serif" font-size="16" fill="#6a796b" text-anchor="start" font-weight="400">01–01 = piece 01, card 01   ·   Illustrative exercise, not a song transcription</text>
