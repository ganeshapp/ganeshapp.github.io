<text x="36" y="152" font-family="Arial, sans-serif" font-size="16" fill="#367657" text-anchor="start" font-weight="700">01  /  LEARN THE MOVEMENTS</text>
<text x="36" y="181" font-family="Arial, sans-serif" font-size="19" fill="#233e33" text-anchor="start" font-weight="400">Start hands apart. Give each step equal time, then try both hands.</text>
