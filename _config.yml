title: "GAPP"
subtitle: "My Digital Garden"
description: "My Digital Garden"
url: "https://www.gapp.in"
baseurl: ""
author:
  name: "Gapp"
copyright: "Ganesh APP"
twitter_username: sagaro
github_username: ganeshapp

# Cloudflare Web Analytics. Paste the public token from its JS snippet to enable.
# Leave blank to disable. Only loaded in JEKYLL_ENV=production builds.
analytics:
  cloudflare:
    token: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
timezone: Asia/Seoul

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  roundup:
    output: true
    permalink: /roundup/:path/
  wiki:
    output: true
    permalink: /wiki/:path/
  projects:
    output: true
    permalink: /projects/:path/
  essays:
    output: true
    permalink: /essays/:path/

defaults:
  - scope:
      path: ""
      type: roundup
    values:
      layout: roundup
      render_with_liquid: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - AGENTS.md
  - extras
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - test
