<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
  <p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to the wiki.</a></p>
  <script>
    window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.search + window.location.hash);
  </script>
</body>
</html>
