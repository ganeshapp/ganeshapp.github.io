<div class="prose" style="text-align:center; padding-top: 2rem;">

  <p style="margin-top:0;">This page went for a long run and never came back.</p>
  <p class="post-meta">While you're here — <strong>White to move, mate in one.</strong></p>

  <div id="chess" class="chess-board" aria-label="Chess puzzle: white to move, mate in one"></div>
  <p id="chess-msg" class="chess-msg">Tap the piece you want to move, then its destination.</p>

  <p class="post-meta"><a href="{{ '/' | relative_url }}">go home</a> &middot; <button class="linkish" onclick="document.getElementById('search-toggle').click()">search the site</button></p>

<style>
  .chess-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: min(20rem, 90vw);
    margin: 1.5rem auto 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 1;
    user-select: none;
  }
  .chess-board .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(6vw, 1.9rem);
    line-height: 1;
    cursor: default;
  }
  .chess-board .light { background: #b6c0cc; }
  .chess-board .dark { background: #6a7684; }
  .chess-board .piece { cursor: pointer; }
  .chess-board .sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  .chess-board .hint { box-shadow: inset 0 0 0 3px var(--accent); }
  .chess-piece-w { color: #fbfbfb; text-shadow: 0 1px 1px rgba(0,0,0,.5); }
  .chess-piece-b { color: #14181d; text-shadow: 0 1px 1px rgba(255,255,255,.25); }
  .chess-msg { min-height: 1.4rem; font-size: 0.9rem; color: var(--text-muted); }
  .chess-msg.win { color: var(--accent); font-weight: 700; }
  .linkish { background:none; border:none; color:var(--accent); font:inherit; text-decoration:underline; cursor:pointer; padding:0; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .chess-board.shake { animation: shake .3s; }
</style>

<script>
(function () {
  var board = document.getElementById('chess');
  var msg = document.getElementById('chess-msg');
  if (!board) return;

  // White to move, mate in one: Ra1-a8#
  var pieces = { g8: '♚', f7: '♟', g7: '♟', h7: '♟', a1: '♖', g1: '♔' };
  var white = { a1: true, g1: true };
  var files = ['a','b','c','d','e','f','g','h'];
  var selected = null;
  var solved = false;

  function build() {
    board.innerHTML = '';
    for (var r = 8; r >= 1; r--) {
      for (var f = 0; f < 8; f++) {
        var id = files[f] + r;
        var sq = document.createElement('div');
        sq.className = 'sq ' + (((f + r) % 2 === 0) ? 'dark' : 'light');
        sq.dataset.sq = id;
        if (pieces[id]) {
          var span = document.createElement('span');
          span.textContent = pieces[id];
          span.className = 'piece ' + (white[id] ? 'chess-piece-w' : 'chess-piece-b');
          sq.appendChild(span);
          if (white[id]) sq.dataset.movable = '1';
        }
        board.appendChild(sq);
      }
    }
  }

  function cell(id) { return board.querySelector('[data-sq="' + id + '"]'); }
  function clearSel() {
    board.querySelectorAll('.sel,.hint').forEach(function (e) { e.classList.remove('sel','hint'); });
  }

  board.addEventListener('click', function (e) {
    if (solved) return;
    var sq = e.target.closest('.sq');
    if (!sq) return;
    var id = sq.dataset.sq;

    if (!selected) {
      if (!white[id]) return; // only white pieces are yours to move
      selected = id;
      clearSel();
      sq.classList.add('sel');
      msg.textContent = 'Now tap the square to move to.';
      return;
    }

    if (id === selected) { selected = null; clearSel(); return; }

    // the one winning move
    if (selected === 'a1' && id === 'a8') {
      pieces.a8 = pieces.a1; delete pieces.a1;
      white.a8 = true; delete white.a1;
      solved = true;
      build();
      cell('a8').classList.add('hint');
      cell('g8').classList.add('hint');
      msg.textContent = 'Ra8# — checkmate. Now go find what you were looking for.';
      msg.classList.add('win');
      return;
    }

    // any other move: not mate
    selected = null;
    clearSel();
    board.classList.remove('shake');
    void board.offsetWidth;
    board.classList.add('shake');
    msg.textContent = 'Not mate. White to move, mate in one — the rook is lonely on a1.';
  });

  build();
})();
</script>
