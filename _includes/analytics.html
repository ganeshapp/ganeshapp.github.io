{% assign analytics_token = site.analytics.cloudflare.token | default: '' | strip %}
{% if jekyll.environment == 'production' and analytics_token != '' and page.analytics != false %}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": {{ analytics_token | jsonify | escape }}}'></script>
{% endif %}
